[package]
name = "webwrap-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Already in the tree through wry. Canonical paths without the \\?\ prefix
# where Windows allows, and with it for paths over 260 characters.
dunce = "=1.0.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
webwrap-spec = { path = "../webwrap-spec" }
