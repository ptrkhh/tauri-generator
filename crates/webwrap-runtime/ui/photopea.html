<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Photopea</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #2b2b2b; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      #status {
        position: fixed; right: 12px; bottom: 12px; z-index: 1; pointer-events: none;
        padding: 6px 10px; border-radius: 4px; background: rgb(0 0 0 / 80%);
        color: #fff; font: 13px system-ui, sans-serif;
      }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <!-- The photopea adapter's shell: its script is the runtime's initialization script. -->
    <main id="app"><div id="status" role="status"></div></main>
  </body>
</html>
