[package]
name = "webwrap-discover"
version = "0.1.0"
edition = "2021"

[dependencies]
dom_query = "=0.27.0"
# Already in the tree through tauri. `rustls` verifies with the platform
# store: the Windows certificate store on Windows.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
webwrap-pack = { path = "../webwrap-pack" }
webwrap-spec = { path = "../webwrap-spec" }

[dev-dependencies]
# Already in the tree through reqwest; serves the fixture pages over TLS.
rustls = "=0.23.46"
