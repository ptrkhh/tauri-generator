# The runtime only builds and runs on Windows, so its tests run here rather
# than on the Linux machine that writes the code.
name: windows

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - run: rustup show active-toolchain
      - run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo test -p webwrap-spec
      # The generator embeds both architectures' runtime, so every runner
      # builds both release templates; the packaging tests use them too.
      - name: Build the runtime templates for both architectures
        shell: pwsh
        run: |
          foreach ($t in 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc') {
            cargo build --release -p webwrap-runtime --target $t
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          "WEBWRAP_TEMPLATE_X64=$PWD\target\x86_64-pc-windows-msvc\release\webwrap-runtime.exe" >> $env:GITHUB_ENV
          "WEBWRAP_TEMPLATE_ARM64=$PWD\target\aarch64-pc-windows-msvc\release\webwrap-runtime.exe" >> $env:GITHUB_ENV
      - run: cargo test -p webwrap-pack -p webwrap-generate --target ${{ matrix.target }}
      - run: cargo test -p webwrap-runtime --target ${{ matrix.target }}
      - name: Probe regenerating over a running app
        run: cargo test -p webwrap-pack --target ${{ matrix.target }} --test running_app -- --ignored --nocapture
      - run: cargo clippy -p webwrap-spec -p webwrap-pack -p webwrap-generate -p webwrap-runtime --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build the generator and the acceptance apps
        shell: pwsh
        env:
          T: ${{ matrix.target }}
        run: |
          cargo build --release -p webwrap-generate --target $env:T
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $gen = "target/$env:T/release/webwrap-generate.exe"
          $fx = "docs/windows-runs/fixtures"
          New-Item -ItemType Directory acceptance | Out-Null
          & $gen generate --url www.photopea.com --name Photopea --icon "$fx/photopea-red.png" --out acceptance `
            --adapter photopea --assoc .psd image/vnd.adobe.photoshop "Photoshop document"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $gen generate --url twitter.com --name Twitter --icon "$fx/twitter-blue.png" --out acceptance
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item $env:WEBWRAP_TEMPLATE_X64 acceptance/unspecialized-template-x64.exe
          Copy-Item $env:WEBWRAP_TEMPLATE_ARM64 acceptance/unspecialized-template-arm64.exe
          Copy-Item $gen acceptance/
          Get-ChildItem acceptance | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.target }}
          path: acceptance/
      - name: Smoke-launch this runner's apps and check their WebView2 folders
        shell: pwsh
        env:
          T: ${{ matrix.target }}
        run: |
          $native = if ($env:T -like 'aarch64*') { 'arm64' } else { 'x64' }
          $apps = @{ photopea = '873756fbe97a1384'; twitter = '2fa5e3f40150278f' }
          $procs = foreach ($slug in $apps.Keys) { Start-Process (Resolve-Path "acceptance/$slug-$native.exe") -PassThru }
          Start-Sleep -Seconds 20
          foreach ($p in $procs) { if ($p.HasExited) { throw "$($p.ProcessName) exited early with $($p.ExitCode)" } }
          foreach ($id in $apps.Values) {
            $dir = Join-Path $env:LOCALAPPDATA "WebWrap\$id\EBWebView"
            if (-not (Test-Path $dir)) { throw "missing $dir" }
            "ok: $dir"
          }
          # Tauri's default folder for the shared template identifier; using it would mean shared storage.
          $shared = Join-Path $env:LOCALAPPDATA 'dev.webwrap.runtime\EBWebView'
          if (Test-Path $shared) { throw "$shared exists, so the apps fell back to shared storage" }
          $procs | Stop-Process -Force
