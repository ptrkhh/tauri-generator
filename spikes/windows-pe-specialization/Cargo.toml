[package]
name = "windows-pe-specialization-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
editpe = { version = "0.2.4", features = ["images"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "webwrap-pe-specialize"
path = "src/main.rs"
