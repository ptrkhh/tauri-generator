<!doctype html>
<meta charset="utf-8">
<title>Waiting for handle</title>
<p id="status">Waiting for handle</p>
<script>
  const bridge = window.chrome.webview;
  const status = document.querySelector("#status");
  const post = (type) => bridge.postMessage(JSON.stringify({ type }));
  const announce = () => post("webwrap-probe-ready");
  const timer = setInterval(announce, 250);
  announce();

  bridge.addEventListener("message", async (event) => {
    if (
      event.data?.type === "webwrap-error" &&
      event.data?.message === "Native bridge failed" &&
      Object.keys(event.data).length === 2
    ) {
      clearInterval(timer);
      status.textContent = "FAIL: Native bridge failed";
      document.title = "FAIL";
      return;
    }
    if (event.data?.type !== "webwrap-file") return;
    const handle = event.additionalObjects?.[0];
    if (!(handle instanceof FileSystemFileHandle)) {
      status.textContent = "FAIL: object is not a FileSystemFileHandle";
      return;
    }
    clearInterval(timer);
    try {
      const writable = await handle.createWritable();
      await writable.write(new TextEncoder().encode("webwrap-probe-ok\n"));
      await writable.close();
      status.textContent = "PASS";
      document.title = "PASS";
      post("webwrap-probe-complete");
    } catch (error) {
      status.textContent = "FAIL: " + error;
      document.title = "FAIL";
    }
  });
</script>
